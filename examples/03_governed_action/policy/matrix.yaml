# Example 03: Governed Action — PolicyMatrix
#
# Introduces always_gate_action_classes.
# Any sub-task with task_type "llm_generation" requires human approval
# before it can execute. The agent cannot proceed without it.
#
# This is the pattern for:
#   - Sending emails or notifications
#   - Generating documents for distribution
#   - Any action with external visibility

version: "1.0.0"
tenant_id: "example-org"
effective: "2026-01-01T00:00:00Z"

agent_roles:
  analyst:
    permitted_tools:
      - read_db
      - llm_extraction
      - llm_generation
    permitted_data_sources:
      - documents
    permitted_task_types:
      - deterministic
      - llm_extraction
      - llm_generation
    max_llm_calls_per_step: 5

budget_policy:
  max_cost_per_call_usd: 0.05
  max_cost_per_step_usd: 0.15
  max_cost_per_workflow_usd: 0.50
  max_cost_per_user_day_usd: 5.00
  max_cost_per_tenant_day_usd: 50.00

compliance_rules: []

risk_policy:
  irreversible_min_confidence: 0.90
  always_gate_action_classes:
    - llm_generation
    # ↑ Any sub-task with task_type "llm_generation" is GATED.
    # The PolicyEngine will mark it as a gated task.
    # EvaluateStage will request human approval before execution.
  auto_approve_action_classes:
    - deterministic
    - llm_extraction

loop_policy:
  max_replan_attempts: 3
  max_duration_s: 120
