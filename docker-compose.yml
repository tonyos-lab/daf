# DAF v0.2.0 — Docker Compose
# Usage:
#   cp .env.example .env    # configure your LLM client
#   docker-compose up -d
#   open http://localhost:8000

version: "3.9"

services:
  daf:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./daf.yaml:/app/daf.yaml:ro
      - ./agents:/app/agents:ro
      - ./tools:/app/tools:ro
      - ./policies:/app/policies:ro
      - ./workflows:/app/workflows:ro
      - daf_db:/app/db
    environment:
      - DAF_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Ollama for local model serving
  # Uncomment if your LLMClient uses Ollama
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   restart: unless-stopped

volumes:
  daf_db:
  # ollama_models:
